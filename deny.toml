# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2

# === NOT APPLICABLE — we do not trigger these code paths ===
# RUSTSEC-2026-0002: lru IterMut violates Stacked Borrows
#   Comes via glyphon -> iced_wgpu. We never call IterMut on LRU caches.
# RUSTSEC-2026-0097: rand unsound with custom logger using rand::rng()
#   Comes via zbus -> ashpd -> iced. We do not register custom loggers.
#
# === MONITORED — upstream unmaintained, no CVE, no upgrade path ===
# RUSTSEC-2025-0141: bincode 1.3.3 unmaintained — DIRECT DEPENDENCY
#   Crate abandoned, no replacement. Would require serialization format migration.
# RUSTSEC-2024-0384: instant 0.1.13 unmaintained — via iced/wgpu stack
# RUSTSEC-2024-0436: paste 1.0.15 unmaintained — via metal/wgpu stack
ignore = [
    "RUSTSEC-2026-0002",
    "RUSTSEC-2026-0097",
    "RUSTSEC-2025-0141",
    "RUSTSEC-2024-0384",
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "OFL-1.1",
    "GPL-2.0-only",
    "GPL-3.0-only",
    "GPL-3.0",
    "Zlib",
    "BSL-1.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unlicense",
    "WTFPL",
]
exceptions = [
    { allow = ["OpenSSL"], name = "ring", version = "*" },
    { allow = ["OpenSSL"], name = "openssl-sys", version = "*" },
]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-git = []
